{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Ubicaciones</h2>
        <a href="{% url 'campanias:ubicacion_create' %}" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Nueva Ubicación
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Zona</th>
                            <th>Dirección / Ubicación</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in ubicaciones %}
                        <tr>
                            <td>#{{ item.id }}</td>
                            <td>{{ item.zona }}</td>
                            <td>{{ item.ubicacion }}</td>
                            <td class="text-center">
                                <a href="{% url 'campanias:ubicacion_update' item.id %}" class="btn btn-sm btn-outline-warning">Editar</a>
                                <a href="{% url 'campanias:ubicacion_delete' item.id %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-center text-muted py-4">No hay ubicaciones registradas.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
