{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Eliminar Ubicación</h4>
                </div>
                <div class="card-body text-center">
                    <p class="fs-5">¿Estás seguro de que deseas eliminar la ubicación <strong>{{ ubicacion.zona }} - {{ ubicacion.ubicacion }}</strong>?</p>
                    <form method="POST" action="{% url 'campanias:ubicacion_delete' ubicacion.id %}">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-4">
                    <a href="{% url 'campanias:ubicacion_list' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                    </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
