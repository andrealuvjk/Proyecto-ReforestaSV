{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h5 class="card-title mb-0">Confirmar Eliminación</h5>
                </div>
                <div class="card-body text-center">
                    <p class="fs-5">¿Estás seguro de que deseas eliminar la siguiente campaña?</p>
                    <blockquote class="blockquote bg-light p-3 rounded">
                        <p class="fw-bold text-dark">{{ campania.titulo }}</p>
                    </blockquote>
                    <p class="text-muted small">Esta acción no se puede deshacer.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2 mt-4">
                            <a href="{% url 'campanias:listado_campanias' %}" class="btn btn-secondary">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-danger">
                                Sí, eliminar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
