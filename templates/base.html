<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}ReforestaSV{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- NUEVO: Bootstrap Icons para los iconos de la barra -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <!-- Menú de navegación común a todo el sitio -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container-fluid px-4">
            <!-- Logo y nombre con icono -->
            <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                <i class="bi bi-tree-fill me-2 fs-4"></i> ReforestaSV
            </a>

            <!-- Botón hamburguesa para dispositivos móviles -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Elementos del menú alineados a la derecha -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                    
                    <!-- Enlace a Inventarios (Cambia 'inventario_list' por el name real de tu urls.py) -->
                    <li class="nav-item">
                        <a class="nav-link text-white px-2" href="{% url 'inventarios:inventario_list' %}">
                            <i class="bi bi-boxes me-1"></i> Inventarios
                        </a>
                    </li>

                     <!-- Enlace a Inventarios (Cambia 'inventario_list' por el name real de tu urls.py) -->
                    <li class="nav-item">
                        <a class="nav-link text-white px-2" href="{#}">
                            <i class="bi bi-feather"></i></i> Especies
                        </a>
                    </li>

                    <!-- Enlace a Mantenimiento (Estático por ahora, cambia el '#' cuando esté listo) -->
                    <li class="nav-item">
                        <a class="nav-link text-white px-2" href="{% url 'mantenimientos:lista' %}">
                            <i class="bi bi-tools me-1"></i> Mantenimiento
                        </a>
                    </li>

                    <!-- Enlace a Campañas (Estático por ahora, cambia el '#' cuando esté listo) -->
                    <li class="nav-item">
                        <a class="nav-link text-white px-2" href="#">
                            <i class="bi bi-flag-fill me-1"></i> Campañas
                        </a>
                    </li>

                     <li class="nav-item">
                        <a class="nav-link text-white px-2" href="{% url 'mantenimientos:arboles_lista' %}">
                            <i class="bi bi-tree"></i> Arboles Plantados
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Espacio dinámico donde cada módulo inyectará su propio contenido -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- NUEVO: Bootstrap JS (Indispensable para que el menú móvil colapse y expanda correctamente) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
