{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <!-- Cabecera adaptativa para pantallas pequeñas y grandes -->
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-2">
        <h2 class="text-success m-0">Listado de Especies</h2>
        <a href="{% url 'inventarios:especie_crear' %}" class="btn btn-success"><i class="bi bi-plus-circle"></i>
             Nueva Especie
        </a>
    </div>

    <!-- Tabla envuelta en tarjeta con sombra y responsive horizontal -->
    {% if especies %}
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nombre de la Especie</th>
                        <th scope="col" class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for especie in especies %}
                    <tr>
                        <td class="fw-bold">#{{ especie.id }}</td>
                        <td>{{ especie.nombre }}</td>
                        <td class="text-center">
                            <div class="d-flex flex-column flex-sm-row justify-content-center gap-1">
                                <a href="{% url 'inventarios:especie_editar' especie.id %}" class="btn btn-sm btn-warning text-dark">Editar</a>
                                <a href="{% url 'inventarios:especie_eliminar' especie.id %}" class="btn btn-sm btn-danger">Eliminar</a>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    {% else %}
    <div class="alert alert-warning text-center shadow-sm p-4" role="alert">
        No hay especies registradas.
    </div>
    {% endif %}
</div>
{% endblock %}
